name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check config.py cognition.py inference.py workflow.py health_check.py --ignore E501

      - name: Check core imports
        run: |
          python -c "import config; print('OK config.py')"
          python -c "import cognition; print('OK cognition.py')"

      - name: Run lightweight regression tests
        run: |
          python -m pytest -q tests/test_eval_harness.py tests/test_workflow.py tests/test_unified.py

      - name: Syntax check key entry scripts
        run: |
          python -m py_compile train_arc.py workflow.py inference.py model.py config.py cognition.py

      - name: Run workflow health check
        run: |
          python workflow.py --mode health-check
