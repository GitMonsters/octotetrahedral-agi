name: Stress — Nightly Suite

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      soak_repeat:
        description: "Number of soak iterations (default: 10 in CI; set 1000 for a real overnight run)"
        required: false
        default: "10"
      stress_seed:
        description: "Stress seed override"
        required: false
        default: "1337"

concurrency:
  group: stress-nightly
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Seeded reproducibility reruns
  # ---------------------------------------------------------------------------
  repro-seeded:
    name: Reproducibility Seeded Reruns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy tiktoken pyyaml tqdm pytest ruff

      - name: Set stress environment
        run: |
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"
          SEED="${{ github.event.inputs.stress_seed || '1337' }}"
          echo "STRESS_SEED=${SEED}" >> "$GITHUB_ENV"
          STRESS_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STRESS_TIMESTAMP=${STRESS_TIMESTAMP}" >> "$GITHUB_ENV"
          echo "STRESS_OUT_DIR=artifacts/stress/nightly/${STRESS_TIMESTAMP}" >> "$GITHUB_ENV"

      - name: Run seeded reproducibility test (500 tasks, 3 runs)
        run: bash scripts/stress/repro_seeded.sh --num-tasks 500

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-nightly-repro-${{ env.STRESS_TIMESTAMP }}
          path: artifacts/stress/nightly/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. Distribution-shift robustness
  # ---------------------------------------------------------------------------
  distribution-shift:
    name: Distribution-Shift Robustness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy tiktoken pyyaml tqdm pytest ruff

      - name: Set stress environment
        run: |
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"
          SEED="${{ github.event.inputs.stress_seed || '1337' }}"
          echo "STRESS_SEED=${SEED}" >> "$GITHUB_ENV"
          STRESS_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STRESS_TIMESTAMP=${STRESS_TIMESTAMP}" >> "$GITHUB_ENV"
          echo "STRESS_OUT_DIR=artifacts/stress/nightly/${STRESS_TIMESTAMP}" >> "$GITHUB_ENV"

      - name: Run distribution-shift evaluation
        run: bash scripts/stress/distribution_shift.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-nightly-dist-shift-${{ env.STRESS_TIMESTAMP }}
          path: artifacts/stress/nightly/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Fault injection
  # ---------------------------------------------------------------------------
  fault-injection:
    name: Fault-Injection Handling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy tiktoken pyyaml tqdm pytest ruff

      - name: Set stress environment
        run: |
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"
          SEED="${{ github.event.inputs.stress_seed || '1337' }}"
          echo "STRESS_SEED=${SEED}" >> "$GITHUB_ENV"
          STRESS_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STRESS_TIMESTAMP=${STRESS_TIMESTAMP}" >> "$GITHUB_ENV"
          echo "STRESS_OUT_DIR=artifacts/stress/nightly/${STRESS_TIMESTAMP}" >> "$GITHUB_ENV"

      - name: Run fault-injection test
        run: bash scripts/stress/fault_injection.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-nightly-faults-${{ env.STRESS_TIMESTAMP }}
          path: artifacts/stress/nightly/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Soak test (reduced iterations in CI; use SOAK_REPEAT=1000 overnight)
  # ---------------------------------------------------------------------------
  soak:
    name: Long-Run Soak Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy tiktoken pyyaml tqdm pytest ruff

      - name: Set stress environment
        run: |
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"
          SEED="${{ github.event.inputs.stress_seed || '1337' }}"
          REPEAT="${{ github.event.inputs.soak_repeat || '10' }}"
          echo "STRESS_SEED=${SEED}" >> "$GITHUB_ENV"
          echo "SOAK_REPEAT=${REPEAT}" >> "$GITHUB_ENV"
          STRESS_TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STRESS_TIMESTAMP=${STRESS_TIMESTAMP}" >> "$GITHUB_ENV"
          echo "STRESS_OUT_DIR=artifacts/stress/nightly/${STRESS_TIMESTAMP}" >> "$GITHUB_ENV"

      - name: Run soak test
        run: bash scripts/stress/soak.sh --repeat "${{ github.event.inputs.soak_repeat || '10' }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-nightly-soak-${{ env.STRESS_TIMESTAMP }}
          path: artifacts/stress/nightly/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Summary job
  # ---------------------------------------------------------------------------
  nightly-summary:
    name: Nightly Suite Summary
    runs-on: ubuntu-latest
    needs: [repro-seeded, distribution-shift, fault-injection, soak]
    if: always()
    permissions: {}

    steps:
      - name: Report nightly status
        run: |
          echo "## Nightly Stress Suite Results" >> "$GITHUB_STEP_SUMMARY"
          echo ""                                >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |"               >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|"               >> "$GITHUB_STEP_SUMMARY"
          echo "| Repro Seeded        | ${{ needs.repro-seeded.result }} |"      >> "$GITHUB_STEP_SUMMARY"
          echo "| Distribution Shift  | ${{ needs.distribution-shift.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fault Injection     | ${{ needs.fault-injection.result }} |"   >> "$GITHUB_STEP_SUMMARY"
          echo "| Soak                | ${{ needs.soak.result }} |"              >> "$GITHUB_STEP_SUMMARY"
