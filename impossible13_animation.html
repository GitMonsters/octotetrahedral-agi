<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>13 Impossible Tasks</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --panel: rgba(16, 20, 28, 0.82);
      --panel-strong: rgba(14, 18, 26, 0.95);
      --text: #f5f7fb;
      --muted: rgba(214, 224, 255, 0.72);
      --green: #36ff95;
      --green-dim: rgba(54, 255, 149, 0.2);
      --gold: #ffd86b;
      --danger: #ff6161;
      --shadow: 0 0 24px rgba(54, 255, 149, 0.16);
      --grid-border: rgba(255, 255, 255, 0.74);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, rgba(54, 255, 149, 0.10), transparent 28%),
                  radial-gradient(circle at 80% 20%, rgba(0, 191, 255, 0.10), transparent 30%),
                  linear-gradient(180deg, #0b0b12 0%, #08090e 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black, transparent 86%);
      pointer-events: none;
      opacity: 0.28;
    }

    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .progress-shell {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.06);
      z-index: 9;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #1cff88, #7bffce);
      box-shadow: 0 0 18px rgba(54,255,149,0.8);
      transition: width 420ms ease;
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 34px 44px 32px;
      gap: 22px;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
    }

    .title {
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      margin: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: clamp(0.92rem, 1.4vw, 1.12rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hud-meta {
      display: flex;
      gap: 14px;
      align-items: stretch;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .meta-box {
      min-width: 132px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.18);
    }

    .meta-label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 1.22rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 0;
    }

    .panel {
      width: min(1280px, 100%);
      min-height: 100%;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      backdrop-filter: blur(16px);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    .phase-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .phase-label {
      font-size: 0.78rem;
      color: var(--green);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(54,255,149,0.45);
    }

    .task-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(1.15rem, 2.4vw, 2rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: lowercase;
    }

    .task-counter {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .content {
      height: calc(100% - 88px);
      display: grid;
      gap: 18px;
      align-items: center;
    }

    .typing-layout {
      grid-template-columns: 1.2fr 0.8fr;
    }

    .validate-layout {
      grid-template-columns: 1fr;
      align-content: start;
    }

    .solve-layout {
      grid-template-columns: 1fr auto 1fr;
    }

    .typing-card,
    .validate-card,
    .solve-card,
    .finale-card {
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .typing-card {
      min-height: 460px;
      padding: 18px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .typing-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(54,255,149,0.5);
      background: rgba(54,255,149,0.12);
      color: #dfffe9;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      animation: pulse 1.2s ease-in-out infinite;
      box-shadow: 0 0 18px rgba(54,255,149,0.25);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 18px rgba(54,255,149,0.2); }
      50% { transform: scale(1.04); box-shadow: 0 0 26px rgba(54,255,149,0.45); }
    }

    .code {
      flex: 1;
      margin: 0;
      padding: 20px;
      background: rgba(0,0,0,0.34);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.06);
      color: #d7ffe6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(0.82rem, 1.25vw, 1rem);
      line-height: 1.5;
      white-space: pre-wrap;
      overflow: hidden;
      position: relative;
      min-height: 360px;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      margin-left: 3px;
      background: var(--green);
      height: 1.1em;
      vertical-align: -0.15em;
      animation: blink 0.9s steps(1) infinite;
      box-shadow: 0 0 12px rgba(54,255,149,0.7);
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }

    .typing-side {
      display: grid;
      gap: 16px;
      align-content: center;
      padding: 12px;
    }

    .side-stat {
      padding: 18px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
    }

    .side-label {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 8px;
    }

    .side-value {
      font-size: 1.5rem;
      font-weight: 750;
    }

    .validate-card {
      padding: 18px 20px 22px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .validate-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .training-count {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      font-weight: 800;
      color: var(--green);
      text-shadow: 0 0 20px rgba(54,255,149,0.36);
      font-variant-numeric: tabular-nums;
    }

    .train-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .train-pair {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
    }

    .train-pair.pass {
      border-color: rgba(54,255,149,0.45);
      box-shadow: 0 0 22px rgba(54,255,149,0.18);
      transform: translateY(-1px);
    }

    .pair-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pair-check {
      color: var(--green);
      font-size: 1.1rem;
      opacity: 0;
      transition: opacity 180ms ease;
      text-shadow: 0 0 16px rgba(54,255,149,0.6);
    }

    .train-pair.pass .pair-check { opacity: 1; }

    .pair-body {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .arrow {
      font-size: 1.5rem;
      color: var(--green);
      text-shadow: 0 0 16px rgba(54,255,149,0.5);
      animation: nudge 1s ease-in-out infinite;
    }

    @keyframes nudge {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(7px); }
    }

    .solve-card {
      min-height: 500px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      align-items: center;
    }

    .solve-title {
      font-size: clamp(1.5rem, 3vw, 2.6rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--green);
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 180ms ease, transform 180ms ease;
      text-shadow: 0 0 18px rgba(54,255,149,0.55), 0 0 34px rgba(54,255,149,0.25);
    }

    .solve-title.show {
      opacity: 1;
      transform: scale(1);
    }

    .solve-grid-title {
      margin-bottom: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.78rem;
      text-align: center;
    }

    .solve-arrow {
      align-self: center;
      font-size: clamp(2rem, 4vw, 3.4rem);
      color: var(--green);
      text-shadow: 0 0 24px rgba(54,255,149,0.5);
      animation: breathe 1.2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.82; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .grid-shell {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .grid {
      display: grid;
      gap: 0;
      padding: 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 16px 40px rgba(0,0,0,0.22);
      justify-content: center;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      border: 0.5px solid var(--grid-border);
      opacity: 1;
      transform: scale(1);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .cell.hidden {
      opacity: 0;
      transform: scale(0.12);
    }

    .finale {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 32px;
      background: radial-gradient(circle at center, rgba(255,216,107,0.14), transparent 38%), rgba(5, 7, 12, 0.84);
      backdrop-filter: blur(10px);
      z-index: 5;
    }

    .finale.show { display: grid; }

    .finale-card {
      width: min(900px, 100%);
      padding: 40px 36px;
      text-align: center;
      background: rgba(16,18,26,0.84);
      border-color: rgba(255,216,107,0.24);
      box-shadow: 0 0 42px rgba(255,216,107,0.12), 0 26px 80px rgba(0,0,0,0.42);
    }

    .finale-kicker {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.84rem;
      margin-bottom: 16px;
    }

    .finale-big {
      font-size: clamp(2.6rem, 7vw, 5.8rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #fff4cf;
      text-shadow: 0 0 18px rgba(255,216,107,0.55), 0 0 44px rgba(255,216,107,0.18);
      margin: 0;
    }

    .finale-sub {
      margin-top: 18px;
      font-size: clamp(1rem, 2vw, 1.45rem);
      color: #fff0bf;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .finale-time {
      margin-top: 18px;
      font-size: 1.3rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .loop-button {
      margin-top: 28px;
      border: 1px solid rgba(255,216,107,0.34);
      background: rgba(255,216,107,0.08);
      color: #fff4cf;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .loop-button:hover {
      transform: translateY(-1px);
      background: rgba(255,216,107,0.14);
    }

    @media (max-width: 980px) {
      .app { padding: 24px 18px 18px; }
      .content,
      .typing-layout,
      .solve-layout { grid-template-columns: 1fr; }
      .solve-arrow { transform: rotate(90deg); }
      .phase-row { flex-wrap: wrap; }
      .hud { grid-template-columns: 1fr; }
      .hud-meta { justify-content: flex-start; }
    }
  </style>
</head>

      for (let index = 0; index < TASKS.length; index += 1) {
        if (token !== state.token) return;
        const task = TASKS[index];
        taskIdEl.textContent = task.id;

        phaseLabel.textContent = 'SYNTHESIZING';
        setProgress(index, 0.08);
        renderTypingPhase(task);
        if (!(await sleep(1200, token))) return;

        phaseLabel.textContent = 'VALIDATING';
        setProgress(index, 0.42);
        renderValidationPhase(task);
        if (!(await sleep(800, token))) return;

        phaseLabel.textContent = 'SOLVED';
        setProgress(index, 0.72);
        const solveDuration = renderSolvePhase(task);
        if (!(await sleep(solveDuration, token))) return;

        state.completed = index + 1;
        setSolvedCount(state.completed);
        setProgress(index + 1, 0);
      }

      phaseLabel.textContent = 'COMPLETE';
      taskIdEl.textContent = 'all tasks conquered';
      spawnCelebration();
      finale.classList.add('show');
      finaleTime.textContent = `Elapsed: ${((performance.now() - state.startTime) / 1000).toFixed(1)}s`;
    }

    replayButton.addEventListener('click', () => {
      runSequence();
    });

    setSolvedCount(0);
    runSequence();
  </script>
</body>
</html>
