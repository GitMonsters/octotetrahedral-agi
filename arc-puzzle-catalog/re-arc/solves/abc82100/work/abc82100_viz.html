const COLORS = {
  0:'#111',1:'#4fc3f7',2:'#ef5350',3:'#66bb6a',4:'#ffee58',
  5:'#e0e0e0',6:'#ab47bc',7:'#ffa726',8:'#29b6f6',9:'#8d6e63'
};
const COLOR_NAMES = {
  0:'Black',1:'Blue',2:'Red',3:'Green',4:'Yellow',
  5:'White',6:'Purple',7:'Orange',8:'Cyan (8)',9:'Brown'
};
const PHASE_COLORS = {
  input:'#29b6f6', clusters:'#ffd54f', indicators:'#ff4081',
  templates:'#69f0ae', sources:'#ff6e40', output:'#ab47bc'
};

let curEx = 0, curStep = 0, playing = false, timer = null;

function buildTabs() {
  const el = document.getElementById('tabs');
  DATA.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 4 ? ' test-tab' : '') + (i === 0 ? ' active' : '');
    btn.textContent = d.label;
    btn.onclick = () => selectEx(i);
    btn.id = 'tab-' + i;
    el.appendChild(btn);
  });
}

function selectEx(i) {
  if (playing) stopPlay();
  curEx = i;
  curStep = 0;
  document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('active', j === i));
  render();
}

function render() {
  const ex = DATA[curEx];
  const step = ex.steps[curStep];
  const {H, W} = ex;

  // Tabs
  document.getElementById('tab-' + curEx)?.scrollIntoView({block:'nearest'});

  // Grid title
  document.getElementById('grid-title').textContent = ex.label + ' — ' + step.title;
  document.getElementById('grid-sub').textContent = step.subtitle;

  // Phase label
  const pl = document.getElementById('phase-label');
  pl.textContent = step.phase.toUpperCase();
  pl.style.color = PHASE_COLORS[step.phase] || '#29b6f6';

  document.getElementById('info-title').textContent = step.title;
  document.getElementById('info-sub').textContent = step.subtitle;

  // Step counter
  document.getElementById('step-counter').textContent =
    `Step ${curStep + 1} of ${ex.steps.length}`;

  // Progress
  document.getElementById('progress-fill').style.width =
    ((curStep + 1) / ex.steps.length * 100) + '%';

  // Dots
  const dotsEl = document.getElementById('step-dots');
  dotsEl.innerHTML = '';
  ex.steps.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i === curStep ? ' active' : i < curStep ? ' done' : '');
    d.title = s.title;
    d.onclick = () => { if(playing) stopPlay(); curStep = i; render(); };
    dotsEl.appendChild(d);
  });

  // Build overlay map
  const overlayMap = {};
  (step.overlays || []).forEach(ov => {
    const key = ov.r + ',' + ov.c;
    if (!overlayMap[key]) overlayMap[key] = [];
    overlayMap[key].push(ov);
  });

  // Grid
  const grid = step.grid;
  const gridEl = document.getElementById('arc-grid');
  gridEl.style.gridTemplateColumns = `repeat(${W}, 28px)`;
  gridEl.innerHTML = '';

  const isOutput = step.phase === 'output';

  grid.forEach((row, r) => {
    row.forEach((val, c) => {
      const cell = document.createElement('div');
      cell.className = 'cell c' + val;
      cell.style.background = COLORS[val] || '#111';

      const ovs = overlayMap[r + ',' + c] || [];
      if (ovs.length > 0) {
        const ov = ovs[0];
        if (ov.type === 'cluster')   cell.classList.add('ov-cluster');
        if (ov.type === 'indicator') cell.classList.add('ov-indicator');
        if (ov.type === 'entry')     cell.classList.add('ov-entry');
        if (ov.type === 'template')  cell.classList.add('ov-template');
        if (ov.type === 'source')    cell.classList.add('ov-source');
      }

      if (isOutput && step.match && val !== 0) {
        setTimeout(() => cell.classList.add('ov-matched'), (r * W + c) * 8 + 100);
      }

      cell.title = `(${r},${c}) = ${val} [${COLOR_NAMES[val] || val}]` +
                   (ovs.length ? ' — ' + ovs.map(o=>o.type).join(',') : '');
      gridEl.appendChild(cell);
    });
  });

  // Legend
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  const legendItems = getLegendItems(step);
  legendItems.forEach(li => {
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<div class="legend-dot" style="background:${li.color};box-shadow:0 0 4px ${li.color}66"></div>
                     <span>${li.label}</span>`;
    legendEl.appendChild(row);
  });

  // Match banner
  const banner = document.getElementById('match-banner');
  banner.classList.toggle('show', isOutput && !!step.match);

  // Button states
  document.getElementById('btn-prev').disabled = curStep === 0;
  document.getElementById('btn-next').disabled = curStep === ex.steps.length - 1;
}

function getLegendItems(step) {
  const phase = step.phase;
  if (phase === 'input') return [
    {color:'#29b6f6', label:'Color 8 — cluster cells'},
    {color:'#4fc3f7', label:'Non-8 values — indicators & sources'},
  ];
  if (phase === 'clusters') return [
    {color:'#ffd54f', label:'Cluster cells (highlighted)'},
    {color:'#29b6f6', label:'Color 8 cells'},
  ];
  if (phase === 'indicators') return [
    {color:'#ff4081', label:'Indicator cells'},
    {color:'#e040fb', label:'Entry point (2·closer − farther)'},
  ];
  if (phase === 'templates') return [
    {color:'#69f0ae', label:'Template shape (offset offsets)'},
  ];
  if (phase === 'sources') return [
    {color:'#ff6e40', label:'Source cells (to be stamped)'},
  ];
  if (phase === 'output') return [
    {color:'#69f0ae', label:'Stamped output cells'},
    {color:'#ab47bc', label:'Free cells (passed through)'},
  ];
  return [];
}

function nextStep() {
  const ex = DATA[curEx];
  if (curStep < ex.steps.length - 1) { curStep++; render(); }
}
function prevStep() {
  if (curStep > 0) { curStep--; render(); }
}
function resetEx() {
  if (playing) stopPlay();
  curStep = 0; render();
}
function togglePlay() {
  playing ? stopPlay() : startPlay();
}
function startPlay() {
  playing = true;
  document.getElementById('btn-play').textContent = '⏸ Pause';
  timer = setInterval(() => {
    const ex = DATA[curEx];
    if (curStep < ex.steps.length - 1) {
      curStep++; render();
    } else {
      stopPlay();
    }
  }, 900);
}
function stopPlay() {
  playing = false;
  clearInterval(timer);
  document.getElementById('btn-play').textContent = '▶ Play';
}

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextStep();
  if (e.key === 'ArrowLeft')  prevStep();
  if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
  if (e.key >= '1' && e.key <= '5') selectEx(parseInt(e.key) - 1);
});

buildTabs();
render();
</script>
