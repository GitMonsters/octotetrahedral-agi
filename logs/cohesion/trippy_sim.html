<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OctoTetrahedral AGI — Sim</title>
<style>
:root {
  --bg:   #07080f;
  --panel:#0e1018;
  --border:rgba(80,120,200,0.18);
  --text: #c8d8f0;
  --muted:#556688;
  --accent:#5b9cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,'SF Mono',monospace; overflow:hidden; height:100vh; display:flex; flex-direction:column; }

/* ── Header ─────────────────────────────────── */
#header {
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:.55rem 1.2rem;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  z-index:20;
}
#header h1 { font-size:.95rem; font-weight:600; color:var(--accent); letter-spacing:.1em; }
#header p  { font-size:.65rem; color:var(--muted); margin-top:.15rem; }
#pass-badge {
  font-size:.72rem; background:rgba(91,156,246,.12); border:1px solid rgba(91,156,246,.3);
  border-radius:4px; padding:.2rem .6rem; color:var(--accent); letter-spacing:.06em;
}

/* ── Body ────────────────────────────────────── */
#body { flex:1; display:flex; min-height:0; }

/* ── Canvas area ─────────────────────────────── */
#canvas-wrap {
  flex:1; position:relative; overflow:hidden;
}
canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
#bg-c { z-index:0; }
#main-c { z-index:1; }

/* ── Right sidebar ───────────────────────────── */
#sidebar {
  flex:0 0 260px; background:var(--panel);
  border-left:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
  z-index:20;
}

.s-section {
  padding:.7rem 1rem;
  border-bottom:1px solid var(--border);
}
.s-title {
  font-size:.58rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin-bottom:.55rem;
}

/* KPI grid */
#kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
.kpi {
  background:rgba(255,255,255,.03); border:1px solid var(--border);
  border-radius:6px; padding:.45rem .6rem;
}
.kpi-val { font-size:1.2rem; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }
.kpi-lbl { font-size:.58rem; color:var(--muted); margin-top:.1rem; }

/* Sparkline */
#sp-wrap { height:52px; }
#sp { width:100%; height:100%; display:block; }
.sp-legend { display:flex; gap:.8rem; margin-top:.3rem; }
.sp-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:3px; vertical-align:middle; }
.sp-lbl { font-size:.6rem; color:var(--muted); }

/* Calculus bars */
#calc-bars { display:flex; flex-direction:column; gap:.35rem; }
.calc-row { display:flex; align-items:center; gap:.5rem; }
.calc-name { font-size:.62rem; color:var(--muted); width:32px; text-align:right; flex-shrink:0; }
.calc-track { flex:1; height:6px; background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden; }
.calc-fill  { height:100%; border-radius:3px; transition:width .25s; }
.calc-num   { font-size:.6rem; color:var(--text); width:36px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }

/* Limbs */
#limb-list { display:flex; flex-direction:column; gap:.28rem; flex:1; overflow-y:auto; }
.limb-row { display:flex; align-items:center; gap:.5rem; }
.limb-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.limb-name { font-size:.63rem; color:var(--text); flex:1; text-transform:capitalize; }
.limb-bar-wrap { width:55px; height:4px; background:rgba(255,255,255,.07); border-radius:2px; overflow:hidden; }
.limb-bar { height:100%; border-radius:2px; }
.limb-cnt { font-size:.58rem; color:var(--muted); width:18px; text-align:right; }

/* Braid status */
#braid-nodes { display:flex; justify-content:space-around; }
.braid-node { text-align:center; }
.braid-orb {
  width:36px; height:36px; border-radius:50%; margin:0 auto .3rem;
  display:flex; align-items:center; justify-content:center;
  font-size:.58rem; font-weight:700; border:1.5px solid;
}
.braid-lbl { font-size:.6rem; color:var(--muted); }
.braid-cnt { font-size:.7rem; font-weight:600; }
</style>
</head>

          <div class="braid-lbl">HERMES</div>

    </div>

</div><!-- /body -->

const limbList = document.getElementById('limb-list');
LIMBS.forEach((l, i) => {
  const hue = (i / LIMBS.length * 360) | 0;
  const row = document.createElement('div');
  row.className = 'limb-row';
  row.innerHTML = `
    <div class="limb-dot" style="background:hsl(${hue},70%,55%)"></div>
    <div class="limb-name">${l.replace(/_limb$/,'').replace(/_/g,' ')}</div>
    <div class="limb-bar-wrap"><div class="limb-bar" id="lb-${i}" style="background:hsl(${hue},70%,55%);width:${(LCOUNTS[i]/MAX_LC*100).toFixed(0)}%"></div></div>
    <div class="limb-cnt">${LCOUNTS[i]}</div>`;
  limbList.appendChild(row);
});

// ── Mouse ─────────────────────────────────────────────────────────────────────
let mx = 0, my = 0;
window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

// ── Background: slow dark aurora ──────────────────────────────────────────────
let bgHue = 220;
function drawBg(t) {
  bgHue = (bgHue + 0.08) % 360;
  bgX.clearRect(0, 0, W, H);
  bgX.fillStyle = '#07080f';
  bgX.fillRect(0, 0, W, H);
  const blobs = [
    { x: W*(0.25+0.18*Math.sin(t*0.00022)), y: H*(0.35+0.18*Math.cos(t*0.00017)), r:W*0.38, h:(bgHue)%360,      a:0.10 },
    { x: W*(0.75+0.15*Math.cos(t*0.00018)), y: H*(0.65+0.15*Math.sin(t*0.00024)), r:W*0.32, h:(bgHue+110)%360,  a:0.09 },
    { x: W*(0.50+0.12*Math.sin(t*0.00029+1)),y:H*(0.50+0.12*Math.cos(t*0.00021+2)),r:W*0.28,h:(bgHue+230)%360,  a:0.08 },
  ];
  for (const b of blobs) {
    const g = bgX.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, `hsla(${b.h},60%,28%,${b.a})`);
    g.addColorStop(1, 'transparent');
    bgX.fillStyle = g; bgX.fillRect(0, 0, W, H);
  }
}

// ── Tet grid ──────────────────────────────────────────────────────────────────
function drawTetGrid(t, ci) {
  const cx = W/2, cy = H/2;
  const rot = t * 0.00018;
  const scl = Math.min(W, H) * 0.32;
  const wobble = Math.sin(t * 0.0008) * 0.04;
  const px2 = (mx / (W + 260) - 0.5) * 0.10;  // account for sidebar
  const py2 = (my / H - 0.5) * 0.10;
  const cosR = Math.cos(rot+wobble), sinR = Math.sin(rot+wobble);

  function nxy(i) {
    const rx = PX[i]*cosR - PY[i]*sinR + px2;
    const ry = PX[i]*sinR + PY[i]*cosR + py2;
    return [cx+rx*scl, cy+ry*scl];
  }

  // Faces — very subtle
  ctx.save(); ctx.globalAlpha = 0.035 + ci.curl*0.07;
  for (let f=0; f<N_FACES; f++) {
    const [ax,ay]=nxy(FI0[f]), [bx,by]=nxy(FI1[f]), [cx2,cy2]=nxy(FI2[f]);
    const hue=(f/N_FACES*360+frame*0.25)%360;
    ctx.fillStyle=`hsl(${hue},75%,58%)`;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.lineTo(cx2,cy2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // Edges
  ctx.save();
  for (let e=0; e<N_EDGES; e++) {
    const [ax,ay]=nxy(EI_SRC[e]), [bx,by]=nxy(EI_DST[e]);
    const hue=(e/N_EDGES*360+frame*0.35+ci.cohesion*80)%360;
    const pulse=0.18+0.28*Math.abs(Math.sin(t*0.0016+e*0.09));
    ctx.strokeStyle=`hsla(${hue},85%,62%,${pulse})`;
    ctx.lineWidth=0.6+EW[e]*1.2*(0.4+ci.grad*0.6);
    ctx.shadowColor=`hsl(${hue},100%,65%)`; ctx.shadowBlur=4;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  ctx.restore();

  // Nodes
  ctx.save(); ctx.shadowBlur=0;
  for (let n=0; n<64; n++) {
    const [nx,ny]=nxy(n);
    const hue=(n/64*360+frame*0.4+ci.curl*160)%360;
    const pulse=0.5+0.5*Math.sin(t*0.003+n*0.32);
    const r=1.8+pulse*3.5*ci.cohesion;
    const grd=ctx.createRadialGradient(nx,ny,0,nx,ny,r*4);
    grd.addColorStop(0,`hsla(${hue},100%,80%,0.55)`);
    grd.addColorStop(1,`hsla(${hue},100%,50%,0)`);
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(nx,ny,r*4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`hsl(${hue},100%,90%)`; ctx.beginPath(); ctx.arc(nx,ny,r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ── Braid routing (canvas only — no labels, sidebar has those) ────────────────
const BNODES = [
  { rx:0.20, ry:0.28, hue:38  },
  { rx:0.50, ry:0.14, hue:150 },
  { rx:0.80, ry:0.28, hue:275 },
];
const bParts = [];

function updateBraid() {
  if (frame%16===0) {
    const arc=frame%3;
    bParts.push({ arc, prog:0, speed:0.011+Math.random()*0.009, hue:BNODES[(arc+1)%3].hue, size:2+Math.random()*2.5 });
  }
  for (let i=bParts.length-1;i>=0;i--) {
    bParts[i].prog+=bParts[i].speed;
    if(bParts[i].prog>=1) bParts.splice(i,1);
  }
}

function drawBraid(t) {
  const bx=i=>W*BNODES[i].rx, by=i=>H*BNODES[i].ry;
  for (let i=0;i<3;i++) {
    const j=(i+1)%3;
    const ax=bx(i),ay=by(i),ex=bx(j),ey=by(j);
    const cmx=(ax+ex)/2+(ay-ey)*0.3, cmy=(ay+ey)/2+(ex-ax)*0.3;
    const hue=BNODES[i].hue, a=0.08+0.07*Math.sin(t*0.002+i*2);
    ctx.save();
    ctx.strokeStyle=`hsla(${hue},75%,58%,${a})`;
    ctx.lineWidth=1.2; ctx.setLineDash([4,8]);
    ctx.shadowColor=`hsl(${hue},90%,60%)`; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(cmx,cmy,ex,ey);
    ctx.stroke(); ctx.restore();
  }
  for (const p of bParts) {
    const i=p.arc, j=(i+1)%3;
    const ax=bx(i),ay=by(i),ex=bx(j),ey=by(j);
    const cmx=(ax+ex)/2+(ay-ey)*0.3, cmy=(ay+ey)/2+(ex-ax)*0.3;
    const u=p.prog,v=1-u;
    const ppx=v*v*ax+2*v*u*cmx+u*u*ex;
    const ppy=v*v*ay+2*v*u*cmy+u*u*ey;
    ctx.save();
    ctx.shadowColor=`hsl(${p.hue},100%,65%)`; ctx.shadowBlur=14;
    ctx.fillStyle=`hsl(${p.hue},100%,80%)`;
    ctx.beginPath(); ctx.arc(ppx,ppy,p.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // Node dots (small — sidebar has labels)
  BNODES.forEach((n,i)=>{
    const x=W*n.rx,y=H*n.ry;
    const pulse=1+0.22*Math.sin(t*0.003+i*1.4);
    const r=14*pulse;
    const grd=ctx.createRadialGradient(x,y,r*0.1,x,y,r);
    grd.addColorStop(0,`hsla(${n.hue},85%,60%,0.40)`);
    grd.addColorStop(1,'transparent');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.save();
    ctx.shadowColor=`hsl(${n.hue},100%,65%)`; ctx.shadowBlur=8;
    ctx.fillStyle=`hsl(${n.hue},90%,82%)`;
    ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const labels=['SIM','EUP','HER'];
    ctx.fillText(labels[i],x,y);
    ctx.restore();
  });
}

// ── Sparkline ─────────────────────────────────────────────────────────────────
function drawSparkline(upTo) {
  const sw=spC.width,sh=spC.height;
  spX.clearRect(0,0,sw,sh);
  const slice=TL.slice(0,upTo+1);
  if(slice.length<2) return;
  const vals=slice.map(d=>d.cohesion);
  const lo=Math.min(...vals),hi=Math.max(...vals),rng=hi-lo||0.01;
  const sx=i=>(i/(TL.length-1))*sw;
  const sy=v=>sh-(v-lo)/rng*sh*0.80-sh*0.08;
  // Fill under cohesion
  spX.beginPath(); spX.moveTo(sx(0),sh);
  vals.forEach((v,i)=>spX.lineTo(sx(i),sy(v)));
  spX.lineTo(sx(vals.length-1),sh); spX.closePath();
  spX.fillStyle='rgba(126,232,162,0.12)'; spX.fill();
  // Cohesion line
  spX.beginPath(); spX.moveTo(sx(0),sy(vals[0]));
  vals.forEach((v,i)=>{ if(i) spX.lineTo(sx(i),sy(v)); });
  spX.strokeStyle='#7ee8a2'; spX.lineWidth=1.5; spX.stroke();
  // EWMA line
  const ewma=slice.map(d=>d.ewma);
  spX.beginPath(); spX.moveTo(sx(0),sy(ewma[0]));
  ewma.forEach((v,i)=>{ if(i) spX.lineTo(sx(i),sy(v)); });
  spX.strokeStyle='rgba(246,160,91,0.9)'; spX.lineWidth=1; spX.stroke();
  // Current position dot
  const last=vals.length-1;
  spX.beginPath(); spX.arc(sx(last),sy(vals[last]),3,0,Math.PI*2);
  spX.fillStyle='#7ee8a2'; spX.fill();
}

// ── Sidebar updates ───────────────────────────────────────────────────────────
const MAX_CALC = 10;  // rough cap for bar width
function updateSidebar(ci, idx) {
  // Pass counter
  document.getElementById('pc').textContent = String(idx+1).padStart(3,'0');
  // KPIs
  const hue=(ci.cohesion*120)|0;
  const kvc=document.getElementById('kv-c');
  kvc.textContent=ci.cohesion.toFixed(3); kvc.style.color=`hsl(${hue},75%,60%)`;
  document.getElementById('kv-e').textContent=ci.ewma.toFixed(3);
  document.getElementById('kv-lb').textContent=ci.limb_bal.toFixed(3);
  document.getElementById('kv-sk').textContent=ci.skill_cov.toFixed(3);
  // Calculus bars
  const fields=[['g',ci.grad],['d',ci.div],['l',ci.lap],['k',ci.curl]];
  const maxF=Math.max(...fields.map(f=>f[1]),0.01);
  for(const [k,v] of fields) {
    const pct=Math.min(100,(v/maxF*100)).toFixed(0);
    document.getElementById(`cb-${k}`).style.width=pct+'%';
    document.getElementById(`cn-${k}`).textContent=v.toFixed(3);
  }
  // Braid events
  document.getElementById('braid-ev').textContent=ci.events;
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(t) {
  try {
    requestAnimationFrame(loop);
    frame++;
    if(t-lastPassMs>PASS_INTERVAL){ lastPassMs=t; passIdx=(passIdx+1)%TL.length; }
    const ci=TL[passIdx];
    ctx.clearRect(0,0,W,H);
    drawBg(t);
    drawTetGrid(t,ci);
    updateBraid(); drawBraid(t);
    drawSparkline(passIdx);
    updateSidebar(ci,passIdx);
  } catch(e){ console.error(e); }
}
requestAnimationFrame(loop);
</script>
