// ── Animated gradient background (fast) ──────────────────────────────────────
let bgHue = 0;
function drawBg(t) {
  bgHue = (bgHue + 0.15) % 360;
  bgX.clearRect(0, 0, W, H);
  bgX.fillStyle = '#000';
  bgX.fillRect(0, 0, W, H);

  // Three slowly-drifting radial blobs
  const blobs = [
    { x: W * (0.3 + 0.25 * Math.sin(t * 0.00028)),
      y: H * (0.4 + 0.25 * Math.cos(t * 0.00021)),
      r: W * 0.45, hue: (bgHue) % 360, a: 0.18 },
    { x: W * (0.7 + 0.20 * Math.cos(t * 0.00019)),
      y: H * (0.6 + 0.20 * Math.sin(t * 0.00031)),
      r: W * 0.40, hue: (bgHue + 120) % 360, a: 0.16 },
    { x: W * (0.5 + 0.18 * Math.sin(t * 0.00035 + 1)),
      y: H * (0.5 + 0.18 * Math.cos(t * 0.00024 + 2)),
      r: W * 0.35, hue: (bgHue + 240) % 360, a: 0.14 },
  ];
  for (const b of blobs) {
    const g = bgX.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, `hsla(${b.hue},90%,35%,${b.a})`);
    g.addColorStop(1, 'transparent');
    bgX.fillStyle = g; bgX.fillRect(0, 0, W, H);
  }

  // Scanline shimmer
  const shimmer = bgX.createLinearGradient(0, 0, 0, H);
  const phase = (t * 0.001) % 1;
  shimmer.addColorStop(Math.max(0, phase - 0.05), 'transparent');
  shimmer.addColorStop(phase,                     `rgba(180,220,255,0.04)`);
  shimmer.addColorStop(Math.min(1, phase + 0.05), 'transparent');
  bgX.fillStyle = shimmer; bgX.fillRect(0, 0, W, H);
}

// ── Tet grid ──────────────────────────────────────────────────────────────────
function drawTetGrid(t, ci) {
  const cx = W / 2, cy = H / 2;
  const rot  = t * 0.00022;
  const scl  = Math.min(W, H) * 0.27;
  const wobble = Math.sin(t * 0.0009) * 0.05;
  const parallax_x = (mx / W - 0.5) * 0.12;
  const parallax_y = (my / H - 0.5) * 0.12;
  const cosR = Math.cos(rot + wobble), sinR = Math.sin(rot + wobble);

  function nodeXY(i) {
    const rx = PX[i] * cosR - PY[i] * sinR + parallax_x;
    const ry = PX[i] * sinR + PY[i] * cosR + parallax_y;
    return [cx + rx * scl, cy + ry * scl];
  }

  // Faces
  ctx.save();
  ctx.globalAlpha = 0.05 + ci.curl * 0.12;
  for (let f = 0; f < N_FACES; f++) {
    const [ax, ay] = nodeXY(FI0[f]);
    const [bx, by] = nodeXY(FI1[f]);
    const [cx2, cy2] = nodeXY(FI2[f]);
    const hue = (f / N_FACES * 360 + frame * 0.35) % 360;
    ctx.fillStyle = `hsl(${hue},85%,62%)`;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx2, cy2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // Edges
  ctx.save();
  for (let e = 0; e < N_EDGES; e++) {
    const [ax, ay] = nodeXY(EI_SRC[e]);
    const [bx, by] = nodeXY(EI_DST[e]);
    const hue = (e / N_EDGES * 360 + frame * 0.45 + ci.cohesion * 120) % 360;
    const pulse = 0.25 + 0.4 * Math.abs(Math.sin(t * 0.0018 + e * 0.08));
    ctx.strokeStyle = `hsla(${hue},90%,65%,${pulse})`;
    ctx.lineWidth = 0.5 + EW[e] * 1.4 * (0.5 + ci.grad);
    ctx.shadowColor = `hsl(${hue},100%,70%)`; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }
  ctx.restore();

  // Nodes
  ctx.save();
  ctx.shadowBlur = 0;
  for (let n = 0; n < 64; n++) {
    const [nx, ny] = nodeXY(n);
    const hue  = (n / 64 * 360 + frame * 0.5 + ci.curl * 180) % 360;
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.003 + n * 0.31);
    const r = 2 + pulse * 4 * ci.cohesion;
    const grd = ctx.createRadialGradient(nx, ny, 0, nx, ny, r * 4);
    grd.addColorStop(0, `hsla(${hue},100%,80%,0.65)`);
    grd.addColorStop(1, `hsla(${hue},100%,50%,0)`);
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(nx, ny, r * 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsl(${hue},100%,88%)`;
    ctx.beginPath(); ctx.arc(nx, ny, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ── Braid routing ─────────────────────────────────────────────────────────────
const BNODES = [
  { label:'SIMULA', rx:0.18, ry:0.30, hue:40  },
  { label:'EUPHAN', rx:0.50, ry:0.16, hue:160 },
  { label:'HERMES', rx:0.82, ry:0.30, hue:280 },
];
const bParticles = [];

function updateBraid() {
  if (frame % 15 === 0) {
    const arc = frame % 3;
    bParticles.push({ arc, prog:0, speed:0.012+Math.random()*0.01,
      hue:BNODES[(arc+1)%3].hue, size:2.5+Math.random()*3 });
  }
  for (let i = bParticles.length - 1; i >= 0; i--) {
    bParticles[i].prog += bParticles[i].speed;
    if (bParticles[i].prog >= 1) bParticles.splice(i, 1);
  }
}

function drawBraid(t) {
  const bx = i => W * BNODES[i].rx;
  const by = i => H * BNODES[i].ry;

  // Arc lines
  for (let i = 0; i < 3; i++) {
    const j = (i+1)%3;
    const ax=bx(i),ay=by(i),ex=bx(j),ey=by(j);
    const cmx=(ax+ex)/2+(ay-ey)*0.28, cmy=(ay+ey)/2+(ex-ax)*0.28;
    const hue = BNODES[i].hue;
    const alpha = 0.12 + 0.1*Math.sin(t*0.002+i*2);
    ctx.save();
    ctx.strokeStyle=`hsla(${hue},80%,60%,${alpha})`;
    ctx.lineWidth=1.5; ctx.setLineDash([5,9]);
    ctx.shadowColor=`hsl(${hue},100%,65%)`; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(cmx,cmy,ex,ey);
    ctx.stroke(); ctx.restore();
  }

  // Particles along arcs
  for (const p of bParticles) {
    const i=p.arc, j=(i+1)%3;
    const ax=bx(i),ay=by(i),ex=bx(j),ey=by(j);
    const cmx=(ax+ex)/2+(ay-ey)*0.28, cmy=(ay+ey)/2+(ex-ax)*0.28;
    const u=p.prog, v=1-u;
    const px2=v*v*ax+2*v*u*cmx+u*u*ex;
    const py2=v*v*ay+2*v*u*cmy+u*u*ey;
    ctx.save();
    ctx.shadowColor=`hsl(${p.hue},100%,70%)`; ctx.shadowBlur=18;
    ctx.fillStyle=`hsl(${p.hue},100%,82%)`;
    ctx.beginPath(); ctx.arc(px2,py2,p.size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Node orbs
  BNODES.forEach((n,i) => {
    const x=W*n.rx, y=H*n.ry;
    const pulse=1+0.28*Math.sin(t*0.003+i*1.3);
    const r=20*pulse;
    const grd=ctx.createRadialGradient(x,y,r*0.15,x,y,r);
    grd.addColorStop(0,`hsla(${n.hue},90%,65%,0.55)`);
    grd.addColorStop(1,`hsla(${n.hue},90%,40%,0)`);
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.save();
    ctx.shadowColor=`hsl(${n.hue},100%,70%)`; ctx.shadowBlur=12;
    ctx.fillStyle=`hsl(${n.hue},100%,92%)`;
    ctx.font='bold 10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(n.label, x, y);
    ctx.restore();
  });
}

// ── Limb constellation ────────────────────────────────────────────────────────
function drawLimbs(t, ci) {
  const cx=W/2, cy=H/2;
  const R=Math.min(W,H)*0.47;
  const active=LIMBS.slice(0,10);
  active.forEach((l,i) => {
    const angle=(i/active.length)*Math.PI*2 - Math.PI/2 + t*0.00028;
    const r=R+Math.sin(t*0.0022+i*0.65)*9;
    const nx=cx+r*Math.cos(angle), ny=cy+r*Math.sin(angle);
    const hue=(i/active.length*360+frame*0.55)%360;
    const pulse=0.5+0.5*Math.sin(t*0.004+i*0.85);
    const sz=3+pulse*5*(0.4+0.6*LCOUNTS[i]/MAX_LC);
    ctx.save();
    ctx.shadowColor=`hsl(${hue},100%,65%)`; ctx.shadowBlur=15*pulse;
    const grd=ctx.createRadialGradient(nx,ny,0,nx,ny,sz*3.5);
    grd.addColorStop(0,`hsla(${hue},90%,70%,${0.55*pulse})`);
    grd.addColorStop(1,`hsla(${hue},90%,50%,0)`);
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(nx,ny,sz*3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`hsl(${hue},100%,92%)`;
    ctx.beginPath(); ctx.arc(nx,ny,sz,0,Math.PI*2); ctx.fill();
    const lx=cx+(r+26)*Math.cos(angle), ly=cy+(r+26)*Math.sin(angle);
    ctx.font=`${Math.max(7,8+pulse*2)|0}px monospace`;
    ctx.fillStyle=`hsla(${hue},80%,80%,${0.35+pulse*0.45})`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(l.replace('_limb','').replace(/_/g,' '), lx, ly);
    ctx.restore();
  });
}

// ── Sparkline ─────────────────────────────────────────────────────────────────
function drawSparkline(upTo) {
  const sw=spC.width, sh=spC.height;
  spX.clearRect(0,0,sw,sh);
  const slice=TL.slice(0,upTo+1);
  if(slice.length<2) return;
  const vals=slice.map(d=>d.cohesion);
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const rng=hi-lo||0.01;
  const sx=i=>(i/(TL.length-1))*sw;
  const sy=v=>sh-(v-lo)/rng*sh*0.82-sh*0.05;
  // Fill
  const grd=spX.createLinearGradient(0,0,sw,0);
  grd.addColorStop(0,'rgba(91,156,246,0.45)');
  grd.addColorStop(0.5,'rgba(126,232,162,0.45)');
  grd.addColorStop(1,'rgba(246,160,91,0.45)');
  spX.beginPath(); spX.moveTo(sx(0),sh);
  vals.forEach((v,i)=>spX.lineTo(sx(i),sy(v)));
  spX.lineTo(sx(vals.length-1),sh); spX.closePath();
  spX.fillStyle=grd; spX.fill();
  spX.beginPath(); spX.moveTo(sx(0),sy(vals[0]));
  vals.forEach((v,i)=>{ if(i>0) spX.lineTo(sx(i),sy(v)); });
  spX.strokeStyle='#7ee8a2'; spX.lineWidth=1.5; spX.stroke();
  // EWMA
  const ewma=slice.map(d=>d.ewma);
  spX.beginPath(); spX.moveTo(sx(0),sy(ewma[0]));
  ewma.forEach((v,i)=>{ if(i>0) spX.lineTo(sx(i),sy(v)); });
  spX.strokeStyle='rgba(246,160,91,0.85)'; spX.lineWidth=1; spX.stroke();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD(ci, idx) {
  document.getElementById('pc').textContent = idx+1;
  document.getElementById('kv-c').textContent = ci.cohesion.toFixed(3);
  document.getElementById('kv-e').textContent = ci.ewma.toFixed(3);
  document.getElementById('kv-g').textContent = ci.grad.toFixed(3);
  document.getElementById('kv-k').textContent = ci.curl.toFixed(3);
  document.getElementById('kv-v').textContent = ci.events;
  const hue=(ci.cohesion*120)|0;
  document.getElementById('kv-c').style.color=`hsl(${hue},80%,65%)`;
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(t) {
  try {
    requestAnimationFrame(loop);
    frame++;
    if (t - lastPassMs > PASS_INTERVAL) { lastPassMs = t; passIdx = (passIdx+1) % TL.length; }
    const ci = TL[passIdx];
    ctx.clearRect(0,0,W,H);
    drawBg(t);
    drawLimbs(t, ci);
    drawTetGrid(t, ci);
    updateBraid(); drawBraid(t);
    drawSparkline(passIdx);
    updateHUD(ci, passIdx);
  } catch(e) {
    console.error('loop error:', e);
  }
}
requestAnimationFrame(loop);
</script>
